services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: swapstash
      POSTGRES_USER: swapstash
      POSTGRES_PASSWORD: swapstash-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swapstash -d swapstash"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "change-me-to-a-long-random-secret-key"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      DB_ENGINE: "postgresql"
      DB_NAME: "swapstash"
      DB_USER: "swapstash"
      DB_PASSWORD: "swapstash-local-only"
      DB_HOST: "db"
      DB_PORT: "5432"
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"

volumes:
  postgres_data:
