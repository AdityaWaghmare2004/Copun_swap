<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Create account</title>
</head>
<body>
    <main>
        <h1>Create account</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign up</button>
        </form>
        <p><a href="{% url 'accounts:login' %}">Already have an account? Log in</a></p>
    </main>
</body>
</html>
