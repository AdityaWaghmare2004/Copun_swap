{% extends "base.html" %}

{% block title %}Create account{% endblock %}

{% block content %}
<div class="mx-auto max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="mb-4 text-2xl font-semibold">Create account</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full rounded bg-sky-600 px-4 py-2 font-medium text-white hover:bg-sky-500">Sign up</button>
    </form>
    <p class="mt-4 text-sm text-slate-600">
        Already have an account? <a href="{% url 'accounts:login' %}" class="text-sky-700 underline">Log in</a>
    </p>
</div>
{% endblock %}
