{% extends "base.html" %}

{% block title %}Upload a coupon{% endblock %}

{% block content %}
<div class="mx-auto max-w-3xl rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="mb-4 text-2xl font-semibold">Upload a coupon</h1>

    <form method="post" enctype="multipart/form-data" x-data="previewUpload()" x-init="bindFileInput()" class="space-y-5">
        {% csrf_token %}
        {{ form.as_p }}
        <div x-show="previewUrl" class="mt-4 rounded-lg border border-dashed border-slate-300 bg-slate-50 p-3">
            <p class="mb-2 text-sm font-medium text-slate-700">Image preview</p>
            <img :src="previewUrl" alt="Uploaded preview" class="max-h-64 rounded-lg border border-slate-200 object-contain">
        </div>
        <button type="submit" class="rounded bg-sky-600 px-4 py-2 font-medium text-white hover:bg-sky-500">Upload and scan</button>
    </form>
</div>

<script>
function previewUpload() {
    return {
        previewUrl: '',
        bindFileInput() {
            const input = this.$el.querySelector('input[type="file"][name="proof_image"]');
            if (!input) return;
            input.addEventListener('change', (event) => this.previewImage(event));
        },
        previewImage(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) {
                this.previewUrl = '';
                return;
            }
            this.previewUrl = URL.createObjectURL(file);
        }
    };
}
</script>
{% endblock %}
