databases:
  - name: django-postgres-db
    databaseName: app_db
    user: app_user
    plan: free
    region: oregon

services:
  - type: web
    name: django-web-service
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: django-postgres-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: USE_S3_STORAGE
        value: "False"
